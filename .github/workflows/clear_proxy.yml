name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install PyYAML

      - name: Advanced Omnivorous Parser
        run: |
          # Создаем пустую ручную папку на сервере, если её ещё нет в репозитории
          mkdir -p manual_proxies
          
          # Запускаем предварительный декодер
          python .github/workflows/decoder.py
          sleep 5

          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          import yaml
          import os
          from urllib.parse import urlparse, parse_qs, unquote

          yaml_urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
              #"https://githubusercontent.com"
          ]
          
          final_structure = {"proxies": []}
          proxy_count = 0
          seen_names = set()

          # ЭТАП 0: АБСОЛЮТНЫЙ ПРИОРИТЕТ — РУЧНОЕ УПРАВЛЕНИЕ
          manual_dir = "manual_proxies"
          if os.path.exists(manual_dir):
              for filename in sorted(os.listdir(manual_dir)):
                  if proxy_count >= 70: break
                  file_path = os.path.join(manual_dir, filename)
                  if os.path.isfile(file_path):
                      try:
                          print(f"👑 РУЧНОЙ ПРИОРИТЕТ: Загружаю серверы из файла {filename}")
                          with open(file_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          
                          # Если закинули готовый YAML ручной работы
                          if "proxies:" in content or "- name:" in content:
                              parsed_manual = yaml.safe_load(content)
                              proxies_list = parsed_manual if isinstance(parsed_manual, list) else parsed_manual.get("proxies", [])
                              for proxy in proxies_list:
                                  p_name = proxy.get("name", f"Manual_{proxy_count}")
                                  if p_name not in seen_names:
                                      seen_names.add(p_name)
                                      proxy["name"] = f"⭐_{p_name}"  # Клеим почетную звезду!
                                      if "password" in proxy: proxy["password"] = str(proxy["password"]).strip('"').strip("'")
                                      final_structure["proxies"].append(proxy)
                                      proxy_count += 1
                                      if proxy_count >= 70: break
                                      
                          # Если закинули простой список vless:// / ss:// из буфера V2Ray
                          else:
                              links = content.splitlines()
                              for idx, link in enumerate(links):
                                  if proxy_count >= 70: break
                                  if not link.strip() or "://" not in link: continue
                                  
                                  # Парсим ссылку профессионально и безопасно
                                  try:
                                      clean_link = unquote(link.strip())
                                      parsed = urlparse(clean_link)
                                      if parsed.scheme != "vless": continue
                                      
                                      uuid = parsed.username
                                      server_port = parsed.netloc.split("@")[-1]
                                      if ":" not in server_port: continue
                                      server, port = server_port.split(":")[:2]
                                      
                                      raw_name = unquote(parsed.fragment) if parsed.fragment else "Manual"
                                      clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:20]
                                      params = parse_qs(parsed.query)
                                      
                                      vless_block = {
                                          "name": f"⭐_{clean_name}_{proxy_count}",
                                          "type": "vless", "server": server, "port": int(port), "uuid": uuid,
                                          "cipher": "none", "tls": True, "udp": True,
                                          "network": params.get("network", ["tcp"])[0],
                                          "servername": params.get("sni", [server])[0],
                                          "client-fingerprint": params.get("fp", ["chrome"])[0]
                                      }
                                      if vless_block["name"] not in seen_names:
                                          final_structure["proxies"].append(vless_block)
                                          seen_names.add(vless_block["name"])
                                          proxy_count += 1
                                  except: continue
                      except Exception as e:
                          print(f"❌ Ошибка разбора ручного файла {filename}: {e}")


          # ЭТАП 1: ДОБИРАЕМ ОСТАТКИ ИЗ ГОТОВЫХ YAML БАЗ (Hysteria2 / Shadowsocks)
          for url in yaml_urls:
              if proxy_count >= 70: break
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  parsed_yaml = yaml.safe_load(content)
                  if parsed_yaml and "proxies" in parsed_yaml:
                      for proxy in parsed_yaml["proxies"]:
                          p_type = str(proxy.get("type", "")).lower()
                          if p_type in ["hysteria2", "ss", "shadowsocks", "tuic"]:
                              p_name = proxy.get("name", f"Proxy_{proxy_count}")
                              if p_name not in seen_names:
                                  seen_names.add(p_name)
                                  if "password" in proxy: proxy["password"] = str(proxy["password"]).strip('"').strip("'")
                                  final_structure["proxies"].append(proxy)
                                  proxy_count += 1
                                  if proxy_count >= 70: break
              except: continue

          # ЭТАП 2: ДОБИРАЕМ ОСТАТКИ ИЗ АВТОМАТИЧЕСКОГО ЧЕРНОВИКА ДЕКОДЕРА
          try:
              with open("pure_raw_proxies.txt", "r", encoding="utf-8") as f:
                  found_links = f.read().splitlines()
              
              for idx, link in enumerate(found_links):
                  if proxy_count >= 70: break
                  try:
                      parsed = urlparse(link.strip())
                      if parsed.scheme != "vless": continue
                      uuid = parsed.username
                      server_port = parsed.netloc.split("@")[-1]
                      server, port = server_port.split(":")
                      raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                      clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                      
                      params = parse_qs(parsed.query)
                      vless_block = {
                          "name": f"💎_{clean_name}_{proxy_count}",
                          "type": "vless", "server": server, "port": int(port), "uuid": uuid,
                          "cipher": "none", "tls": True, "udp": True, "network": params.get("network", ["tcp"]),
                          "servername": params.get("sni", [server]), "client-fingerprint": params.get("fp", ["chrome"])
                      }
                      if vless_block["name"] not in seen_names:
                          final_structure["proxies"].append(vless_block)
                          seen_names.add(vless_block["name"])
                          proxy_count += 1
                  except: continue
          except: pass

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              yaml.dump(final_structure, f, allow_unicode=True, default_flow_style=False, indent=2)
          print(f"🏁 СБОРКА ИДЕАЛЬНО ЗАВЕРШЕНА! Всего в файле: {proxy_count} прокси.")
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          git add pure_raw_proxies.txt live_free.yaml
          git commit -m "Switch to Manual Priority Folder architecture" --allow-empty
          git push origin main --force
