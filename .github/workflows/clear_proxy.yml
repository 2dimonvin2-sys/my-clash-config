name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Advanced Omnivorous Parser
        run: |
          # 1. ЗАПУСКАЕМ ДЕКОДЕР ДЛЯ СОЗДАНИЯ ЧИСТОГО СПИСКА
          python decoder.py
          
          # 2. ДАЕМ ДЕКОДЕРУ ОТДОХНУТЬ 5 СЕКУНД
          echo "⏱️ Ожидание синхронизации базы данных..."
          sleep 5

          # 3. ГЛАВНЫЙ НЕУБИВАЕМЫЙ КОД УПАКОВКИ В YAML
          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          from urllib.parse import urlparse, parse_qs, unquote

          yaml_urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
          ]
          
          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          def parse_vless(url_str, idx):
              try:
                  parsed = urlparse(url_str.strip())
                  if parsed.scheme != "vless": return None
                  uuid = parsed.username
                  server_port = parsed.netloc.split("@")[-1]
                  server, port = server_port.split(":")
                  raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                  clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                  
                  return "\n".join([
                      f"  - name: \"💎_{clean_name}_{idx}\"",
                      f"    type: vless",
                      f"    server: {server}",
                      f"    port: {port}",
                      f"    uuid: \"{uuid}\"",
                      f"    cipher: none",
                      f"    tls: true",
                      f"    udp: false",
                      f"    network: tcp"
                  ])
              except:
                  return None

          # ЧИТАЕМ ССЫЛКИ ИЗ НАШЕГО ИДЕАЛЬНО ОЧИЩЕННОГО ЛОКАЛЬНОГО ФАЙЛА
          try:
              with open("pure_raw_proxies.txt", "r", encoding="utf-8") as f:
                  found_links = f.read().splitlines()
              
              print(f"📋 Главный код принял от декодера {len(found_links)} безопасных ссылок.")
              for idx, link in enumerate(found_links):
                  if proxy_count >= 300: break
                  yaml_proxy = parse_vless(link, idx + proxy_count)
                  if yaml_proxy:
                      output_lines.append(yaml_proxy)
                      proxy_count += 1
          except Exception as e:
              print(f"⚠️ Ошибка чтения чистой базы -> {e}")

          # ДОБИРАЕМ YAML БАЗУ БЕЗ ИЗМЕНЕНИЙ ПАРОЛЕЙ
          for url in yaml_urls:
              if proxy_count >= 300: break
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  lines = content.split("\n")
                  current_proxy = []
                  for line in lines:
                      if line.strip().startswith("- name:"):
                          if current_proxy:
                              proxy_str = "\n".join(current_proxy)
                              if "udp: true" not in proxy_str:
                                  output_lines.append(proxy_str)
                                  proxy_count += 1
                                  if proxy_count >= 300: break
                          current_proxy = [line]
                      elif current_proxy:
                          current_proxy.append(line)
              except: continue

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          
          # Закидываем в облако и чистый список ссылок, и готовый YAML для роутера!
          git add pure_raw_proxies.txt live_free.yaml
          git commit -m "Pipeline: Decoder + Smart Parser with 5s sync" --allow-empty
          git push origin main --force
