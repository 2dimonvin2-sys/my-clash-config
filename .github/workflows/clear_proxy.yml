name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Advanced Omnivorous Parser
        run: |
          python .github/workflows/decoder.py
          sleep 5

          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          import base64
          from urllib.parse import urlparse, parse_qs, unquote

          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          def parse_vless(url_str, idx):
              try:
                  parsed = urlparse(url_str.strip())
                  if parsed.scheme == "yaml-direct":
                      decoded_block = base64.b64decode(parsed.netloc).decode("utf-8")
                      return decoded_block
                      
                  if parsed.scheme != "vless": return None
                  uuid = parsed.username
                  server_port = parsed.netloc.split("@")[-1]
                  server, port = server_port.split(":")
                  raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                  clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                  
                  return "\n".join([
                      f"  - name: \"💎_{clean_name}_{idx}\"",
                      f"    type: vless",
                      f"    server: {server}",
                      f"    port: {port}",
                      f"    uuid: \"{uuid}\"",
                      f"    cipher: none",
                      f"    tls: true",
                      f"    udp: false",
                      f"    network: tcp"
                  ])
              except: return None

          try:
              with open("pure_raw_proxies.txt", "r", encoding="utf-8") as f:
                  found_links = f.read().splitlines()
              
              for idx, link in enumerate(found_links):
                  if proxy_count >= 300: break
                  yaml_proxy = parse_vless(link, idx + proxy_count)
                  if yaml_proxy:
                      n_match = re.search(r"name:\s*[\"\']?([^\"\'\s\n]+)", yaml_proxy)
                      p_name = n_match.group(1).replace('"', '').replace("'", "") if n_match else str(proxy_count)
                      if p_name not in seen_names:
                          seen_names.add(p_name)
                          output_lines.append(yaml_proxy)
                          proxy_count += 1
          except: pass

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          git add pure_raw_proxies.txt live_free.yaml
          git commit -m "Pipeline: Ultimate blend with raw YAML proxy import" --allow-empty
          git push origin main --force
