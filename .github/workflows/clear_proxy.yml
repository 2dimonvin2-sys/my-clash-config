name: Filter and Clean Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Filter Proxies via Python
        run: |
          python -c '
          import urllib.request
          import re

          urls = [
          "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
          "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
          ]
          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          for url in urls:
              if proxy_count >= 300:
                  break
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "clash"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      content = response.read().decode("utf-8")
                  
                  proxies_section = re.search(r"(proxies:.*)", content, re.DOTALL)
                  if proxies_section:
                      lines = proxies_section.group(1).split("\n")
                      current_proxy = []
                      
                      for line in lines[1:]:
                          if line.strip().startswith("- name:"):
                              if current_proxy:
                                  proxy_str = "".join(current_proxy)
                                  if "udp: true" not in proxy_str:
                                      name_match = re.search(r"name:\s*[\"\']?([^\"\'\s]+)", proxy_str)
                                      p_name = name_match.group(1) if name_match else str(proxy_count)
                                      if p_name not in seen_names:
                                          seen_names.add(p_name)
                                          output_lines.extend(current_proxy)
                                          proxy_count += 1
                                          if proxy_count >= 300:
                                              break
                              current_proxy = [line]
                          elif current_proxy:
                              current_proxy.append(line)
              except Exception as e:
                  print(f"Error loading {url}: {e}")
                  continue
              
          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines))
          '

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live_free.yaml
          git commit -m "Update clean proxy list" || exit 0
          git push -f
