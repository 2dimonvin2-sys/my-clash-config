name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Advanced Omnivorous Parser
        run: |
          python .github/workflows/decoder.py
          sleep 5

          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          from urllib.parse import urlparse, parse_qs, unquote

          yaml_urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
              #"https://githubusercontent.com"
          ]
          
          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          # ПЕРВЫЙ ПРИОРИТЕТНЫЙ ЭТАП: СНАЧАЛА ЗАБИРАЕМ ГОТОВЫЕ СТАБИЛЬНЫЕ YAML БАЗЫ (Hysteria2)
          for url in yaml_urls:
              if proxy_count >= 300: break
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  lines = content.split("\n")
                  current_proxy = []
                  for line in lines:
                      if line.strip().startswith("- name:"):
                          if current_proxy:
                              formatted_block = []
                              for item in current_proxy:
                                  stripped = item.strip()
                                  if stripped.startswith("- name:"):
                                      formatted_block.append(f"  {stripped}")
                                  elif ":" in stripped:
                                      key, val = stripped.split(":", 1)
                                      val = val.strip()
                                      if key.strip() == "password":
                                          val = f'"{val.strip(chr(34)).strip(chr(39))}"'
                                      formatted_block.append(f"    {key.strip()}: {val}")
                              
                              proxy_str = "\n".join(formatted_block)
                              # Отсекаем только проблемный VLESS, пропуская Hysteria2 и Shadowsocks со всеми UDP-настройками
                              if "type: vless" not in proxy_str and "type: trojan" not in proxy_str:
                                  n_match = re.search(r"name:\s*[\"\']?([^\"\'\s\n]+)", proxy_str)
                                  p_name = n_match.group(1).replace('"', '').replace("'", "") if n_match else str(proxy_count)
                                  if p_name not in seen_names:
                                      seen_names.add(p_name)
                                      output_lines.append(proxy_str)
                                      proxy_count += 1
                                      if proxy_count >= 300: break
                          current_proxy = [line]
                      elif current_proxy and line.strip():
                          current_proxy.append(line)
              except: continue

          print(f"📦 Приоритетный этап завершен. Загружено {proxy_count} стабильных YAML прокси.")

          # ВТОРОЙ ЭТАП: ДОБИРАЕМ ОСТАТКИ ИЗ НАШЕГО ДЕКОДЕРА СЫРЫХ БАЗ
          try:
              with open("pure_raw_proxies.txt", "r", encoding="utf-8") as f:
                  found_links = f.read().splitlines()
              
              for idx, link in enumerate(found_links):
                  if proxy_count >= 300: break
                  try:
                      parsed = urlparse(link.strip())
                      if parsed.scheme != "vless": continue
                      uuid = parsed.username
                      server_port = parsed.netloc.split("@")[-1]
                      server, port = server_port.split(":")
                      raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                      clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                      
                      block = (
                          f"  - name: \"💎_{clean_name}_{idx + proxy_count}\"\n"
                          f"    type: vless\n"
                          f"    server: {server}\n"
                          f"    port: {port}\n"
                          f"    uuid: \"{uuid}\"\n"
                          f"    cipher: none\n"
                          f"    tls: true\n"
                          f"    udp: false\n"
                          f"    network: tcp"
                      )
                      # Быстрая проверка имени на дубликаты
                      if f"💎_{clean_name}_{idx + proxy_count}" not in seen_names:
                          output_lines.append(block)
                          proxy_count += 1
                  except: continue
          except: pass

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          git add pure_raw_proxies.txt live_free.yaml
          git commit -m "Prioritize stable Hysteria2 over raw VLESS links" --allow-empty
          git push origin main --force
