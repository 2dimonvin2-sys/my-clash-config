name: Filter and Clean Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Subconverter via Docker
        run: |
          # Запускаем официальный контейнер. Передавать команду запуска внутрь не нужно, только параметры!
          docker run --rm -v $(pwd):/workspace tindy2013/subconverter:latest \
          -g --url "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml" \
          --target clash --max_nodes 70 --udp false --sort true --ua "clash"
          
          # Переносим созданный файл в корень с нужным именем
          mv sub.yaml live_free.yaml


      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live_free.yaml
          git commit -m "Update clean proxy list" || exit 0
          git push -f
