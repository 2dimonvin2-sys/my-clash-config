name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Advanced Omnivorous Parser
        run: |
          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          from urllib.parse import urlparse, parse_qs, unquote

          # 1. Источники готового YAML
          yaml_urls = [
              #"https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
              #"https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          ]

          # 2. Секретные базы с сырыми VLESS и Hysteria2 ссылками
          raw_urls = [
              #"https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              #"https://raw.githubusercontent.com/vlessfu/vlessfu/main/working_configs.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless_configs.txt",
              #"https://raw.githubusercontent.com/FreeFolksOn/abc-configs-free-vpn-proxy-list/main/README.md"
          ]
          
          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          def parse_vless(url_str, idx):
              try:
                  parsed = urlparse(url_str.strip())
                  if parsed.scheme != "vless": return None
                  uuid = parsed.username
                  server_port = parsed.netloc.split("@")[-1]
                  server, port = server_port.split(":")[0], int(server_port.split(":")[1])
                  raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                  clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                  if not clean_name or clean_name.startswith("VLESS"):
                      clean_name = f"Secret_{idx}"
                  params = parse_qs(parsed.query)
                  if "udp" in params and params["udp"] == ["true"]: return None
                  
                  block = [
                      f"  - name: \"💎_{clean_name}_{idx}\"",
                      f"    type: vless",
                      f"    server: {server}",
                      f"    port: {port}",
                      f"    uuid: \"{uuid}\"",
                      f"    cipher: none",
                      f"    tls: true",
                      f"    udp: false",
                      f"    network: tcp"
                  ]
                  
                  if "network" in params and params["network"]:
                      block.append(f"    network: {params['network'][0]}")
                  
                  if "security" in params and params["security"] == ["reality"] and "pbk" in params:
                      sni = params['sni'][0] if 'sni' in params and params['sni'] else server
                      block.append(f"    servername: {sni}")
                      
                      # ЖЕСТКИЙ ФИЛЬТР: параметры REALITY пишем ТОЛЬКО если есть публичный ключ!
                      if params["security"] == ["reality"] and "pbk" in params and params["pbk"]:
                          block.append("    reality-opts:")
                          block.append(f"      public-key: {params['pbk'][0]}")
                          
                          # Проверка Short ID перенесена СЮДА (внутрь reality-opts)
                          if "sid" in params and params["sid"]:
                              sid_val = params['sid'][0]
                              is_hex = all(c in "0123456789abcdefABCDEF" for c in sid_val)
                              if is_hex and len(sid_val) % 2 == 0 and 2 <= len(sid_val) <= 16:
                                  block.append(f"      short-id: {sid_val}")
                              else:
                                  return None # Выкидываем, если ключ REALITY сломан



                  
                  if "fp" in params and params["fp"]:
                      block.append(f"    client-fingerprint: {params['fp'][0]}")
                      
                  return "\n".join(block)
              except:
                  return None



          for url in raw_urls:
              if proxy_count >= 300: break
              try:
                  print(f"Scanning raw base: {url}")
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  found_links = re.findall(r'(vless://[^\s"\'<>`]+)', content)
                  start_count = proxy_count
                  for idx, link in enumerate(found_links):
                      yaml_proxy = parse_vless(link, idx + proxy_count)
                      if yaml_proxy:
                          output_lines.append(yaml_proxy)
                          proxy_count += 1
                          if proxy_count >= 300: break
                  print(f"Success raw! Found {proxy_count - start_count} servers.")
              except Exception as e:
                  print(f"Error for raw URL {url} -> {e}")
                  continue

          for url in yaml_urls:
              if proxy_count >= 300: break
              try:
                  print(f"Downloading YAML base: {url}")
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  proxies_section = re.search(r"(proxies:.*)", content, re.DOTALL)
                  if proxies_section:
                      lines = proxies_section.group(1).split("\n")
                      current_proxy = []
                      start_count = proxy_count
                      for line in lines[1:]:
                          if line.strip().startswith("- name:"):
                              if current_proxy:
                                  proxy_str = "\n".join(current_proxy)
                                  if "udp: true" not in proxy_str:
                                      n_match = re.search(r"name:\s*[\"\']?([^\"\'\s]+)", proxy_str)
                                      p_name = n_match.group(1).replace('"', '').replace("'", "") if n_match else str(proxy_count)
                                      proxy_str = proxy_str.replace("cipher: auto", "cipher: none")
                                      if p_name not in seen_names:
                                          seen_names.add(p_name)
                                          output_lines.append(proxy_str)
                                          proxy_count += 1
                                          if proxy_count >= 300: break
                              current_proxy = [line]
                          elif current_proxy: current_proxy.append(line)
                      print(f"Success YAML! Added {proxy_count - start_count} servers.")
              except Exception as e:
                  print(f"Error for YAML URL {url} -> {e}")
                  continue

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Силой заставляем Git переключиться на чистую ветку main
          git fetch origin main
          git checkout main || git checkout -b main
          
          # Перезаписываем файл и делаем жесткий силовой пуш в облако
          git add live_free.yaml
          git commit -m "Update clean proxy list with filters" --allow-empty
          git push origin main --force
