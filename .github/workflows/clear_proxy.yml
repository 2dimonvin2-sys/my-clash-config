name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Advanced Omnivorous Parser
        run: |
          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          from urllib.parse import urlparse, parse_qs, unquote

          yaml_urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
          ]

          raw_urls = [
              # "https://githubusercontent.com",
              #"https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml"
              # "https://githubusercontent.com"
          ]
          
          output_lines = ["proxies:"]
          proxy_count = 0
          seen_names = set()

          def parse_vless(url_str, idx):
              try:
                  parsed = urlparse(url_str.strip())
                  if parsed.scheme != "vless": return None
                  uuid = parsed.username
                  server_port = parsed.netloc.split("@")[-1]
                  server, port = server_port.split(":")
                  raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                  clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                  params = parse_qs(parsed.query)
                  if "udp" in params and params["udp"] == ["true"]: return None
                  
                  block = [
                      f"  - name: \"💎_{clean_name}_{idx}\"",
                      f"    type: {parsed.scheme}",
                      f"    server: {server}",
                      f"    port: {port}",
                      f"    uuid: \"{uuid}\"",
                      f"    cipher: none",
                      f"    tls: true",
                      f"    udp: false",
                      f"    network: tcp"
                  ]
                  
                  if "network" in params and params["network"]:
                      net_raw = params['network'][0] if isinstance(params['network'], list) else params['network']
                      block.append(f"    network: {net_raw}")
                  
                  if "sni" in params and params["sni"]:
                      sni_raw = params['sni'][0] if isinstance(params['sni'], list) else params['sni']
                      block.append(f"    servername: {sni_raw}")
                  else:
                      block.append(f"    servername: {server}")
                      
                  if "fp" in params and params["fp"]:
                      fp_raw = params['fp'][0] if isinstance(params['fp'], list) else params['fp']
                      block.append(f"    client-fingerprint: {fp_raw}")
                      
                  return "\n".join(block)
              except:
                  return None
          # =========================================================
          # ДОПОЛНИТЕЛЬНЫЙ БЛОК: КОНВЕРТЕР СЛОЖНЫХ YAML/ПЛЕЙЛИСТОВ В СЫРЫЕ ССЫЛКИ
          # =========================================================
          complex_urls = [
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt"
          ]

          print("\n=== 🛠️ ЗАПУСК КОНВЕРТЕРА СЛОЖНЫХ ССЫЛОК ===")
          converted_raw_links = []
          for url in complex_urls:
              try:
                  print(f"🔄 Конвертирую и вытягиваю vless:// из: {url}")
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  if "proxies:" in content or "- name:" in content:
                      lines = content.split("\n")
                      for line in lines:
                          if "server:" in line and ":" in line:
                              server_val = line.split("server:")[-1].strip()
                              converted_raw_links.append(f"vless://fake-uuid@{server_val}:443?security=none#Converted")
                  else:
                      found = re.findall(r'(vless://[^\s"\'<>`]+)', content)
                      if found:
                          converted_raw_links.extend(found)
              except Exception as e:
                  print(f"❌ Ошибка конвертации источника -> {e}")

          print(f"📦 Конвертер успешно передал основному коду {len(converted_raw_links)} сырых ссылок.\n")

          # ЭТАП 1: ЧИТАЕМ СЫРЫЕ БАЗЫ VLESS
          print("\n=== 🛠️ ЗАПУСК ЭТАПА 1: СКАНИРОВАНИЕ СЫРЫХ БАЗ VLESS ===")
          for url in raw_urls:
              if proxy_count >= 300:
                  print("⚠️ Достигнут лимит в 300 серверов. Сканирование остановлено.")
                  break
              try:
                  # Извлекаем красивое имя домена для отчета
                  domain = urlparse(url).path.split('/')[2] if '/' in url else url
                  print(f"🔎 Проверяю сырой источник: .../{domain}...")
                  
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  found_links = re.findall(r'((?:vless|ss|trojan)://[^\s"\'<>`]+)', content)
                  found_links.extend(converted_raw_links)
                  if not found_links:
                      print(f"❌ Формат неверен: На сайте нет сырых vless:// ссылок.")
                      continue
                      
                  start_count = proxy_count
                  for idx, link in enumerate(found_links):
                      yaml_proxy = parse_vless(link, idx + proxy_count)
                      if yaml_proxy:
                          output_lines.append(yaml_proxy)
                          proxy_count += 1
                          if proxy_count >= 300: break
                  print(f"✅ УСПЕХ! Сайт отдал списки. Извлечено серверов: {proxy_count - start_count}")
              except Exception as e:
                  print(f"💥 Ошибка сети: Сайт не ответил или заблокирован -> {e}")
                  continue

          # ЭТАП 2: ДОБИРАЕМ YAML БАЗУ ПОСТРОЧНО
          print("\n=== 🛠️ ЗАПУСК ЭТАПА 2: СКАНИРОВАНИЕ ГОТОВЫХ YAML БАЗ ===")
          for url in yaml_urls:
              if proxy_count >= 300:
                  print("⚠️ Достигнут лимит в 300 серверов. База YAML пропущена.")
                  break
              try:
                  domain = urlparse(url).path.split('/')[2] if '/' in url else url
                  print(f"📦 Загружаю готовый YAML файл: .../{domain}...")
                  
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  if "proxies:" not in content and "- name:" not in content:
                      print(f"❌ Формат неверен: Этот файл не является конфигурацией Clash/Mihomo.")
                      continue
                      
                  lines = content.split("\n")
                  current_proxy = []
                  start_count = proxy_count
                  for line in lines:
                      if line.strip().startswith("- name:"):
                          if current_proxy:
                              proxy_str = "\n".join(current_proxy)
                              if "udp: true" not in proxy_str and "type: vless" not in proxy_str:
                                  n_match = re.search(r"name:\s*[\"\']?([^\"\'\s]+)", proxy_str)
                                  p_name = n_match.group(1).replace('"', '').replace("'", "") if n_match else str(proxy_count)
                                  proxy_str = proxy_str.replace("cipher: auto", "cipher: none")
                                  if p_name not in seen_names:
                                      seen_names.add(p_name)
                                      output_lines.append(proxy_str)
                                      proxy_count += 1
                                      if proxy_count >= 300: break
                          current_proxy = [line]
                      elif current_proxy:
                          current_proxy.append(line)
                  print(f"✅ УСПЕХ! База добавлена. Взято серверов: {proxy_count - start_count}")
              except Exception as e:
                  print(f"💥 Ошибка сети: Не удалось скачать YAML базу -> {e}")
                  continue

          print(f"\n📊 ФИНАЛЬНЫЙ ОТЧЕТ: Всего собрано и упаковано серверов: {proxy_count}")
          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          git add live_free.yaml
          git commit -m "Update proxy list with detailed Russian logs" --allow-empty
          git push origin main --force

