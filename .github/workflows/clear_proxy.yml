name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install PyYAML

      - name: Advanced Omnivorous Parser
        run: |
          python .github/workflows/decoder.py
          sleep 5

          cat << "EOF" > smart_script.py
          import urllib.request
          import re
          import yaml
          from urllib.parse import urlparse, parse_qs, unquote

          yaml_urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
              #"https://githubusercontent.com"
          ]
          
          final_structure = {"proxies": []}
          proxy_count = 0
          seen_names = set()

          # ЭТАП 1: ИДЕАЛЬНОЕ СЛИЯНИЕ ГОТОВЫХ YAML БАЗ (Hysteria2 / Shadowsocks)
          for url in yaml_urls:
              if proxy_count >= 300: break
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ClashMeta"})
                  with urllib.request.urlopen(req, timeout=12) as res:
                      content = res.read().decode("utf-8", errors="ignore")
                  
                  # Парсим файл профессиональной библиотекой PyYAML
                  parsed_yaml = yaml.safe_load(content)
                  if parsed_yaml and "proxies" in parsed_yaml:
                      for proxy in parsed_yaml["proxies"]:
                          p_type = str(proxy.get("type", "")).lower()
                          # Собираем только стабильные протоколы, работающие без REALITY-ключей
                          if p_type in ["hysteria2", "ss", "shadowsocks", "tuic"]:
                              p_name = proxy.get("name", f"Proxy_{proxy_count}")
                              if p_name not in seen_names:
                                  seen_names.add(p_name)
                                  
                                  # Принудительно оборачиваем пароль в кавычки для безопасности роутера
                                  if "password" in proxy:
                                      proxy["password"] = str(proxy["password"]).strip('"').strip("'")
                                      
                                  final_structure["proxies"].append(proxy)
                                  proxy_count += 1
                                  if proxy_count >= 300: break
              except Exception as e:
                  print(f"⚠️ Ошибка чтения YAML базы {url}: {e}")
                  continue

          print(f"📦 Профессиональный этап завершен. Загружено {proxy_count} стабильных YAML прокси.")

          # ЭТАП 2: ДОБИРАЕМ ОСТАТКИ ИЗ НАШЕГО ДЕКОДЕРА СЫРЫХ БАЗ
          try:
              with open("pure_raw_proxies.txt", "r", encoding="utf-8") as f:
                  found_links = f.read().splitlines()
              
              for idx, link in enumerate(found_links):
                  if proxy_count >= 300: break
                  try:
                      parsed = urlparse(link.strip())
                      if parsed.scheme != "vless": continue
                      uuid = parsed.username
                      server_port = parsed.netloc.split("@")[-1]
                      server, port = server_port.split(":")
                      raw_name = unquote(parsed.fragment) if parsed.fragment else "VLESS"
                      clean_name = re.sub(r'[\s"\'#:\-\[\]\(\)\{\}\*,\|&><`!?=]', '_', raw_name).strip('_')[:25]
                      
                      vless_block = {
                          "name": f"💎_{clean_name}_{idx + proxy_count}",
                          "type": "vless",
                          "server": server,
                          "port": int(port),
                          "uuid": uuid,
                          "cipher": "none",
                          "tls": True,
                          "udp": False,
                          "network": "tcp"
                      }
                      
                      if vless_block["name"] not in seen_names:
                          final_structure["proxies"].append(vless_block)
                          proxy_count += 1
                  except: continue
          except: pass

          # Записываем итоговый файл с идеальными отступами в 2 пробела
          with open("live_free.yaml", "w", encoding="utf-8") as f:
              yaml.dump(final_structure, f, allow_unicode=True, default_flow_style=False, indent=2)
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git checkout main || git checkout -b main
          git add pure_raw_proxies.txt live_free.yaml
          git commit -m "Ultimate PyYAML engine conversion" --allow-empty
          git push origin main --force
