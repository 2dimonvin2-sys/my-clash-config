name: Universal Smart Proxy Filter

on:
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pure Clash YAML Merge
        run: |
          cat << 'EOF' > smart_script.py
          import urllib.request
          import re

          urls = [
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
          ]
          
                    output_lines = ["proxies:"] # ИСПРАВЛЕНО: Никаких заголовков proxies: в начале!
          proxy_count = 0
          seen_names = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Clash"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      content = response.read().decode("utf-8", errors="ignore")
                  
                  proxies_section = re.search(r"(proxies:.*)", content, re.DOTALL)
                  if proxies_section:
                      lines = proxies_section.group(1).split("\n")
                      current_proxy = []
                      for line in lines[1:]:
                          if line.strip().startswith("- name:"):
                              if current_proxy:
                                  proxy_str = "\n".join(current_proxy)
                                  if "udp: true" not in proxy_str:
                                      n_match = re.search(r"name:\s*[\"\']?([^\"\'\s]+)", proxy_str)
                                      p_name = n_match.group(1) if n_match else str(proxy_count)
                                      
                                      p_name = p_name.replace('"', '').replace("'", "")
                                      proxy_str = proxy_str.replace("cipher: auto", "cipher: none")
                                      
                                      if p_name not in seen_names:
                                          seen_names.add(p_name)
                                          output_lines.append(proxy_str)
                                          proxy_count += 1
                              current_proxy = [line]
                          elif current_proxy: 
                              current_proxy.append(line)
              except Exception as e:
                  continue

          with open("live_free.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines))
          EOF

          python smart_script.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add live_free.yaml
          git commit -m "Update clean proxy list" || exit 0
          git push -f
